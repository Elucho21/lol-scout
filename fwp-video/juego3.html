<title>Pasa la Posta · Clip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen clip player — 16:9 stage + transport. Single dark brand look (FWP purple). */
:root{
  --ink:#1B0730; --plum:#4A1470; --violet:#6A1B9A; --lav:#F1E9F7; --orange:#E2561F; --muted:#B9A6CC;
  --line:rgba(241,233,247,.14);
  --display:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--lav)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.2vw,38px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--orange)}
.meta{color:var(--muted);font-size:14px}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--plum);box-shadow:0 20px 60px rgba(0,0,0,.45)}
canvas{display:block;width:100%;height:100%;cursor:pointer}
.bigplay{position:absolute;inset:0;margin:auto;width:96px;height:96px;border-radius:50%;border:0;background:var(--orange);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bigplay svg{width:40px;height:40px;margin-left:6px}
.transport{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{font:600 14px var(--body);color:var(--lav);background:rgba(241,233,247,.08);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(241,233,247,.16)}
.btn[aria-pressed="true"]{background:var(--violet);border-color:var(--violet)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#play{background:var(--orange);border-color:var(--orange);min-width:92px;justify-content:center}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:92px}
.bar{flex:1 1 260px;min-width:0;display:flex;align-items:center}
.bar input{width:100%;accent-color:var(--orange);margin:0}
.note{color:var(--muted);font-size:14px;max-width:70ch;margin:0}
@media (max-width:560px){.btn .lbl{display:none}}
</style>

<div class="wrap">
  <header>
    <h1>Pasa la <span>Posta</span></h1>
    <div class="meta">Juego 3 · clip previo al juego · 0:40</div>
  </header>
  <div class="stage">
    <canvas id="stage" width="1280" height="720" aria-label="Clip animado que explica el juego Pasa la Posta"></canvas>
    <button class="bigplay" id="bigplay" aria-label="Reproducir"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg></button>
  </div>
  <div class="transport">
    <button class="btn" id="play">▶ Play</button>
    <div class="time" id="time">0:00 / 0:40</div>
    <div class="bar"><input type="range" id="seek" min="0" max="40" step="0.02" value="0" aria-label="Posición"></div>
    <button class="btn" id="subs" aria-pressed="true">CC <span class="lbl">Locución</span></button>
    <button class="btn" id="snd" aria-pressed="true">♪ <span class="lbl">Sonido</span></button>
    <button class="btn" id="voice" aria-pressed="false">🎙 <span class="lbl">Voz</span></button>
    <button class="btn" id="fs">⛶ <span class="lbl">Pantalla</span></button>
  </div>
  <p class="note">Formato de clip previo al juego: primero lo que está en juego, después tres pasos, los errores y el «¡A jugar!». La maqueta representa el jardín de la casa; con fotos del espacio real se ajusta la distribución.</p>
</div>

<script>
(()=>{
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const W=1280,H=720,DUR=40,S=56;
const C={p1:'#4A1470',p2:'#6A1B9A',lav:'#F1E9F7',or:'#E2561F',ink:'#2A0C40',ok:'#1FA463',bad:'#E03434',gold:'#F4B42A'};
const TEAM=['#7B2FB0','#E2561F','#11A29A','#EFB310'];
const NAMES=['VIOLETA','NARANJA','TURQUESA','AMARILLO'];
const FD='"Baloo 2", ui-rounded, system-ui, sans-serif',FB='Figtree, system-ui, sans-serif';

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function mix(a,b,k){const p=h=>{if(h.startsWith('rgb'))return h.match(/\d+/g).map(Number);const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};const A=p(a),B=p(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')})`}
function shade(hex,a){return mix(hex,a<0?'#000000':'#FFFFFF',Math.abs(a))}

/* ---------- drawing primitives ---------- */
function L(pts,w,col){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.lineWidth=w;ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function circ(x,y,r,f){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=f;ctx.fill()}
function rr(x,y,w,h,r,f){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=f;ctx.fill()}
function txt(s,x,y,font,col,align='center'){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function poly(pts,f){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill()}

/* ---------- isometric ---------- */
const P=(x,y,z=0)=>[(x-y)*.866*S,(x+y)*.5*S-z*S];
function box(x,y,z,w,d,h,top,left,right){
  const a=P(x,y+d,z),b=P(x+w,y+d,z),c=P(x+w,y,z),A=P(x,y+d,z+h),B=P(x+w,y+d,z+h),Cc=P(x+w,y,z+h),D=P(x,y,z+h);
  poly([a,b,B,A],left);poly([b,c,Cc,B],right);poly([A,B,Cc,D],top)}
let CAM={x:0,y:0,z:1,sx:0,sy:0};
const toScreen=(x,y,z)=>{const p=P(x,y,z);return[(p[0]-CAM.x)*CAM.z+W/2+CAM.sx,(p[1]-CAM.y)*CAM.z+H/2+CAM.sy]};

/* ---------- products & props ---------- */
function pouch(x,y,s,type='eboost',rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  const body=type==='renova'?'#F6EEFB':'#5B1A8C';
  ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.lineTo(10.5,-30);ctx.quadraticCurveTo(10,-33,7,-33);ctx.lineTo(-7,-33);ctx.quadraticCurveTo(-10,-33,-10.5,-30);ctx.closePath();
  ctx.fillStyle=body;ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='rgba(42,12,64,.35)';ctx.stroke();
  ctx.fillStyle=type==='eboost'?'#7A34AE':'#D9C3EA';ctx.fillRect(-10,-31,20,4);
  if(type==='eboost'){ctx.fillStyle=C.or;ctx.beginPath();ctx.moveTo(2,-24);ctx.lineTo(-5,-13);ctx.lineTo(0,-13);ctx.lineTo(-3,-5);ctx.lineTo(5,-16);ctx.lineTo(0,-16);ctx.closePath();ctx.fill()}
  else{ctx.fillStyle=C.p2;ctx.beginPath();ctx.ellipse(0,-15,5,9,.5,0,Math.PI*2);ctx.fill();circ(5,-7,2.2,C.or)}
  ctx.restore()}
function bag(x,y,n,red=0){
  const h=22+Math.min(n,14)*1.5,w=20+Math.min(n,14)*.6;
  ctx.lineWidth=2;ctx.strokeStyle='#B79BCE';ctx.beginPath();ctx.moveTo(x-4,y+5);ctx.quadraticCurveTo(x,y-4,x+4,y+5);ctx.stroke();
  const m=Math.min(n,6);for(let i=0;i<m;i++)pouch(x-w/2+4+i*(w-8)/Math.max(1,m-1),y+11,.34,i%2?'renova':'eboost',(i-2.5)*.12);
  ctx.beginPath();ctx.moveTo(x-w/2,y+5);ctx.lineTo(x+w/2,y+5);ctx.lineTo(x+w/2+2,y+5+h);ctx.lineTo(x-w/2-2,y+5+h);ctx.closePath();ctx.fillStyle=mix('#FFFFFF','#FFB3B3',red);ctx.fill();
  ctx.fillStyle=C.p2;ctx.fillRect(x-w/2-1,y+5+h*.45,w+2,4)}
function bell(x,y,col,press=0){
  ctx.fillStyle='#3A2150';ctx.beginPath();ctx.ellipse(x,y-2,15,5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x,y-4,11,Math.PI,0);ctx.fillStyle=col;ctx.fill();
  rr(x-3,y-18+press*3,6,5,1.5,'#3A2150');ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(x-4,y-9,2.5,4,-.5,0,Math.PI*2);ctx.fill()}
function rings(x,y,k,col=C.or,r0=10,r1=60){if(k<=0||k>=1)return;for(let i=0;i<2;i++){const kk=clamp(k*1.3-i*.25);if(kk<=0)continue;ctx.globalAlpha=1-kk;ctx.lineWidth=4;ctx.strokeStyle=col;ctx.beginPath();ctx.arc(x,y,r0+kk*(r1-r0),0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}
function confetti(k){if(k<=0)return;const cols=[C.p2,C.or,C.gold,'#FFFFFF',TEAM[2]];for(let i=0;i<170;i++){const x=hash(i)*W+Math.sin(k*2+i)*30,y=-30+k*(260+hash(i+99)*300)-hash(i+7)*280;if(y<-20||y>H+20)continue;ctx.save();ctx.translate(x,y);ctx.rotate(k*6*hash(i+3)+i);ctx.fillStyle=cols[i%5];ctx.fillRect(-7,-4,14,8);ctx.restore()}}

function jar(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  rr(-12,-28,24,28,5,'rgba(255,255,255,.95)');ctx.lineWidth=1.2;ctx.strokeStyle='rgba(42,12,64,.35)';ctx.stroke();
  for(let i=0;i<7;i++)circ(-7+(i%4)*4.7,-6-Math.floor(i/4)*6,2.6,i%2?C.or:C.gold);
  rr(-13,-34,26,7,2,C.or);rr(-12,-22,24,7,1,C.p2);ctx.restore()}
function spray(x,y,s,col=C.p2){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  rr(-7,-36,14,36,4,col);rr(-3,-42,6,6,1,'#EDE3F4');rr(-5,-48,10,6,2,'#FFFFFF');rr(-7,-24,14,8,1,'rgba(255,255,255,.85)');ctx.restore()}
function product(type,x,y,s=1,rot=0){if(type==='jar')return jar(x,y,s);if(type==='dreams')return spray(x,y,s,C.p2);if(type==='kfuel')return spray(x,y,s,C.or);
  if(type==='other'){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.lineTo(10.5,-30);ctx.lineTo(-10.5,-30);ctx.closePath();ctx.fillStyle='#FFFFFF';ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='rgba(42,12,64,.35)';ctx.stroke();ctx.fillStyle='#D9C3EA';ctx.fillRect(-10,-31,20,4);circ(0,-15,6,TEAM[2]);circ(0,-15,2.5,'#fff');ctx.restore();return}
  pouch(x,y,s,type,rot)}

/* ---------- mannequin ---------- */
const SKIN='#ECE4F2',SKIN_D='#CFC2DC';
function pawn(o){
  const t=o.t||0,red=o.red||0,drop=o.drop||0;let [bx,by]=o.at;
  const sh=o.shake||0,jx=Math.sin(t*47)*sh,jy=Math.cos(t*41)*sh*.6;
  const col=mix(o.col,C.bad,red),skin=mix(SKIN,'#F6A0A0',red),skinD=mix(SKIN_D,'#D86A6A',red),dark=shade(o.col,-.35);
  ctx.save();ctx.globalAlpha*=(o.alpha??1);
  if(!drop){ctx.fillStyle='rgba(27,7,48,.18)';ctx.beginPath();ctx.ellipse(bx,by,19,7,0,0,Math.PI*2);ctx.fill()}
  if(drop>0){ctx.beginPath();ctx.rect(bx-200,by-400,400,402);ctx.clip();by+=eo(drop)*140}
  if(o.hop)by+=-Math.abs(Math.sin(t*9))*8;
  const p=o.pose||'down',sq=p==='squat'?1-clamp(o.rise||0):0,yo=sq*26;
  if(sq>0.02){L([[bx-7,by-24+yo],[bx-20,by-14+yo*.3],[bx-13,by-2]],10,skinD);L([[bx+7,by-24+yo],[bx+20,by-14+yo*.3],[bx+13,by-2]],10,skinD)}
  else{rr(bx-11,by-26,9,26,4.5,skinD);rr(bx+2,by-26,9,26,4.5,skinD)}
  const T=by-74+yo;
  if(o.pack!=null){const n=Math.min(6,Math.ceil(o.pack/4));for(let i=0;i<n;i++)pouch(bx-14+i*5.6,T+8,.42,i%2?'renova':'eboost',(i-2.5)*.15);rr(bx-21,T+4,42,48,11,mix('#3A1160',C.bad,red))}
  const g=ctx.createLinearGradient(bx-16,0,bx+16,0);g.addColorStop(0,shade(col,.18));g.addColorStop(1,shade(col,-.12));
  rr(bx-16,T,32,52,12,g);rr(bx-16,T+41,32,6,2,dark);
  if(o.pack!=null){L([[bx-9,T+2],[bx-10,T+30]],4,'#2A0C40');L([[bx+9,T+2],[bx+10,T+30]],4,'#2A0C40')}
  const hy=by-88+yo,hg=ctx.createRadialGradient(bx-4,hy-5,2,bx,hy,14);hg.addColorStop(0,'#FFFFFF');hg.addColorStop(1,skin);circ(bx,hy,13,hg);
  const shL=[bx-15,by-68+yo],shR=[bx+15,by-68+yo];let hL=[bx-21,by-34+yo],hR=[bx+21,by-34+yo];
  if(sq>0.02){hL=[bx-17+jx,by-44+yo+jy];hR=[bx+17-jx,by-44+yo-jy]}
  if(p==='up'){hL=[bx-24,by-110+Math.sin(t*10)*4];hR=[bx+24,by-110-Math.sin(t*10)*4]}
  if(p==='grab')hR=[bx+26,by-50];
  if(p==='hug'){hL=[bx-10,by-56];hR=[bx+10,by-56]}
  const arm=(s,h)=>{const e=[(s[0]+h[0])/2+(h[0]<s[0]?-2:2),(s[1]+h[1])/2];L([s,e,h],8,skin);L([[lerp(e[0],h[0],.55),lerp(e[1],h[1],.55)],[lerp(e[0],h[0],.8),lerp(e[1],h[1],.8)]],9,dark);circ(h[0],h[1],5,skin)};
  arm(shL,hL);arm(shR,hR);
  if(o.chin)product(o.chin,bx+2,by-60+yo,.72);
  if(o.knees)product(o.knees,bx,by-6,.72);
  if(o.hand)product(o.hand,hR[0]+2,hR[1]+14,.72);
  ctx.restore()}

/* ---------- set: MoneyHouse garden diorama ---------- */
const LY=[1.3,3.1,4.9,6.7],AX=2.2,BX=9.6,SQX=1.0;
const PROD=['eboost','renova','jar','kfuel','other','dreams'];
function floorRing(x,y,r,col,w=3){ctx.beginPath();for(let i=0;i<=40;i++){const a=i/40*Math.PI*2,p=P(x+Math.cos(a)*r,y+Math.sin(a)*r);i?ctx.lineTo(...p):ctx.moveTo(...p)}ctx.lineWidth=w;ctx.strokeStyle=col;ctx.stroke()}
function floorText(s,x,y,size,col){const o=P(x,y);ctx.save();ctx.translate(o[0],o[1]);ctx.transform(.866,.5,-.866,.5,0,0);txt(s,0,0,`800 ${size}px ${FD}`,col);ctx.restore()}
function setBase(counts){
  poly([P(12,0,0),P(12,8,0),P(12,8,-.55),P(12,0,-.55)],'#4A2E1C');poly([P(0,8,0),P(12,8,0),P(12,8,-.55),P(0,8,-.55)],'#5E3B24');
  poly([P(0,0),P(12,0),P(12,8),P(0,8)],'#8CC96B');
  for(let x=0;x<12;x+=1.5)poly([P(x,0),P(x+.75,0),P(x+.75,8),P(x,8)],'rgba(255,255,255,.07)');
  ctx.setLineDash([10,8]);[.4,2.2,4.0,5.8,7.6].forEach(y=>{const a=P(.3,y),b=P(11.7,y);L([a,b],3,'rgba(255,255,255,.75)')});ctx.setLineDash([]);
  // house facade on back wall
  poly([P(0,0,0),P(12,0,0),P(12,0,3.4),P(0,0,3.4)],'#FBF8FE');poly([P(0,0,3.4),P(12,0,3.4),P(12,-.3,3.6),P(-.3,-.3,3.6)],C.p1);
  const wall=(x0,z0,w,h,draw)=>{const o=P(x0,0,z0);ctx.save();ctx.translate(o[0],o[1]);ctx.transform(.866,.5,0,1,0,0);draw(w*S,h*S);ctx.restore()};
  [[.6,2.6],[2.4,2.6]].forEach(([x,z])=>wall(x,z,1.3,1.5,(w,h)=>{rr(0,0,w,h,4,'#D8C4EA');ctx.fillStyle='#FBF8FE';ctx.fillRect(w/2-2,0,4,h)}));
  wall(4.3,3.0,4.6,1.95,(w,h)=>{rr(-6,-6,w+12,h+12,10,'#2A0C40');rr(0,0,w,h,6,C.p1);txt('PRODUCTOS EN B',w/2,15,`800 15px ${FD}`,'rgba(241,233,247,.85)');
    counts.forEach((v,i)=>{const bw=w/4,x=i*bw+bw*.22,base=h-14;if(v<0){txt('✕',x+bw*.28,base-16,`800 24px ${FD}`,'#FF8A8A');return}const bh=(h-62)*clamp(v/6);rr(x,base-Math.max(bh,3),bw*.56,Math.max(bh,3),4,TEAM[i]);txt(`${Math.round(v)}/6`,x+bw*.28,base-bh-12,`800 15px ${FD}`,'#fff')})});
  wall(9.7,2.9,1.9,.95,(w,h)=>{rr(0,0,w,h,8,C.or);txt('FWP',w/2,h/2,`800 34px ${FD}`,'#FFFFFF')});
  // hedge on left side
  poly([P(0,0,0),P(0,8,0),P(0,8,1.2),P(0,0,1.2)],'#4E9A45');for(let y=.4;y<8;y+=.8){const p=P(0,y,1.2);ctx.fillStyle='#5DAA52';ctx.beginPath();ctx.ellipse(p[0]-10,p[1]+2,30,16,-.5,Math.PI,0);ctx.fill()}
  // lanes: A/B rings
  LY.forEach((y,i)=>{floorRing(AX+.5,y+.15,.5,'#FFFFFF',4);floorRing(BX-.6,y+.15,.5,'#FFFFFF',4);floorText('A',AX+.5,y+.72,30,'rgba(255,255,255,.9)');floorText('B',BX-.6,y+.72,30,'rgba(255,255,255,.9)');
    const a=P(SQX,y+.15);ctx.fillStyle=mix(TEAM[i],'#FFFFFF',.35);ctx.beginPath();ctx.ellipse(a[0],a[1],26,11,0,0,Math.PI*2);ctx.fill()});
  const d=P(AX+1.2,7.95),e=P(BX-1.3,7.95);
}
function tableA(i,left){const y=LY[i]-.55;box(AX-.05,y-.28,0,1.1,.5,.5,'#E9DDF4','#B99AD6','#A383C4');left.forEach((pr,k)=>{const p=P(AX+.08+k*.17,y,.5);product(pr,p[0],p[1]+4,.5)})}
function basketB(i,items){const y=LY[i]-.5,x=BX-.05;box(x-.35,y-.3,0,.7,.6,.45,'#D7A265','#B07A3C','#9A6832');items.forEach((pr,k)=>{const p=P(x-.22+k*.09,y,.42);product(pr,p[0],p[1]+2,.42,(k-2)*.15)})}

/* ---------- lane state ---------- */
function delivered(i,t){if(i===0)return t<16.55?0:t<33?1:t<34.25?5:6;if(i===1)return t<33?0:4;if(i===2)return t<33?0:5;return t>31.4?-1:0}
function carrierState(i,t){
  const y=LY[i]+.15;const s={x:AX+.5,y,pose:'down'};
  if(i===0){if(t>=11.3&&t<12.2){if(t>=11.95)s.chin='eboost'}
    else if(t>=12.2&&t<16.2){s.x=lerp(AX+.5,BX-.6,ease(seg(t,12.2,16.2)));s.chin='eboost';s.hop=1}
    else if(t>=16.2&&t<33)s.x=BX-.6;
    else if(t>=33){s.x=BX-.6;if(t<34.05)s.chin='dreams';if(t>34.5)s.pose='up'}}
  if(i===1){if(t>=24.4&&t<26.3){s.x=AX+.35;s.pose='grab';if(t>=24.8)s.hand='eboost'}if(t>=33){s.x=lerp(5.2,7.8,(t-33)/4.5);s.chin='other';s.hop=1}}

function speakAt(t){try{let i=-1;VO.forEach(([s],k)=>{if(t>=s)i=k});if(i===lastVo)return;lastVo=i;speechSynthesis.cancel();if(!voice||!playing||i<0)return;const u=new SpeechSynthesisUtterance(VO[i][1]);u.lang='es-AR';const v=speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));if(v)u.voice=v;u.rate=1.18;speechSynthesis.speak(u)}catch(e){}}
function frame(now){if(!started&&!playing){renderAt(3.9);last=now;return requestAnimationFrame(frame)}started=true;
  if(playing){const dt=Math.min(.1,(now-last)/1000),prev=T;T+=dt;if(sound)EVENTS.forEach(([et,ty])=>{if(et>prev&&et<=T&&SFX[ty])SFX[ty]()});speakAt(T);if(T>=DUR){T=DUR;setPlaying(false)}}
  last=now;renderAt(T);$('seek').value=T;$('time').textContent=fmt(T)+' / '+fmt(DUR);requestAnimationFrame(frame)}
function setPlaying(p){playing=p;if(p&&T>=DUR-.05)T=0;$('play').textContent=p?'❚❚ Pausa':'▶ Play';$('bigplay').hidden=p;lastVo=-1;if(p){ac()&&AC.state==='suspended'&&AC.resume()}else{try{speechSynthesis.cancel()}catch(e){}}}
$('play').onclick=()=>setPlaying(!playing);$('bigplay').onclick=()=>setPlaying(true);cv.onclick=()=>setPlaying(!playing);
$('seek').oninput=e=>{T=+e.target.value;started=true;lastVo=-1;try{speechSynthesis.cancel()}catch(_){}};
const tog=(id,fn)=>{$(id).onclick=()=>{const on=$(id).getAttribute('aria-pressed')!=='true';$(id).setAttribute('aria-pressed',on);fn(on)}};
tog('subs',v=>showSubs=v);tog('snd',v=>sound=v);tog('voice',v=>{voice=v;lastVo=-1;if(!v)try{speechSynthesis.cancel()}catch(e){}});
$('fs').onclick=()=>{const el=document.querySelector('.stage');(el.requestFullscreen?el.requestFullscreen():Promise.reject()).catch(()=>{})};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){e.preventDefault();setPlaying(!playing)}});
window.FWP={duration:DUR,renderAt,events:EVENTS.map(([t,type])=>({t,type})),setSubs:v=>showSubs=v};
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('800 40px "Baloo 2"'),document.fonts.load('600 20px Figtree')]).catch(()=>{}):Promise.resolve()).then(()=>requestAnimationFrame(frame));
})();
</script>
